server.port=8080
server.servlet.context-path=/ledger

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:eventledger;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — schema controlled via schema.sql, not Hibernate DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# SQL initialisation
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson — use snake_case for all JSON fields globally.
# Jackson derives property names from public getters/setters, not private fields,
# so @JsonProperty on private fields is silently ignored. The naming strategy
# converts getter-derived camelCase names (e.g. getEventId → eventId) to
# snake_case (event_id) for both serialization and deserialization automatically.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ─── Apache Kafka ────────────────────────────────────────────────────────────

# Bootstrap broker address (single-node dev cluster)
spring.kafka.bootstrap-servers=localhost:9092

# ── Producer ────────────────────────────────────────────────────────────────
# Serialize Kafka message keys as plain strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Serialize message values (EventRequest POJOs) as JSON
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# acks=all: broker only acknowledges once all in-sync replicas have written the message
spring.kafka.producer.acks=all
# Retry up to 3 times on transient send failures before propagating the error
spring.kafka.producer.retries=3
# enable.idempotence: guarantees exactly-once delivery to the broker across retries
spring.kafka.producer.properties.enable.idempotence=true
# Required by idempotent producer: at most 1 in-flight request per connection
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
# Do not embed __TypeId__ headers — consumer uses a fixed target type instead
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── Consumer ─────────────────────────────────────────────────────────────────
# Consumer group shared by all EventConsumer instances (load-balanced across partitions)
spring.kafka.consumer.group-id=event-ledger-consumer-group
# Deserialize message keys as plain strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Deserialize message values from JSON into Java objects
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# earliest: on first start, consume from the beginning of the topic (no messages missed)
spring.kafka.consumer.auto-offset-reset=earliest
# Disable auto-commit — we commit offsets manually after successful processing
spring.kafka.consumer.enable-auto-commit=false
# Only trust DTOs from this package when deserializing (security guard against arbitrary class instantiation)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventledger.dto
# Default target type when no __TypeId__ header is present (matches producer setting above)
spring.kafka.consumer.properties.spring.json.value.default.type=com.eventledger.dto.EventRequest

# ── Listener Container ───────────────────────────────────────────────────────
# MANUAL_IMMEDIATE: offset is committed only when Acknowledgment.acknowledge() is explicitly called
spring.kafka.listener.ack-mode=manual_immediate
# Single listener thread per container (adequate for dev; increase for higher throughput)
spring.kafka.listener.concurrency=1

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.kafka.enabled=true
